name: Public Quartz wiki

on:
  workflow_dispatch:
    inputs:
      ref:
        required: false
        default: ""
        type: string
      publish_pages:
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["Daily robotics research", "Podcast publication"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: robotelier-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && vars.ROBOTELIER_PAGES_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the committed wiki source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.4.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked Quartz dependencies
        run: npm ci --prefix site --ignore-scripts
      - name: Derive the canonical project Pages base URL
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          base_url="${owner}.github.io/${repository_name}"
          if [ "${repository_name,,}" = "${owner,,}.github.io" ]; then
            base_url="${owner}.github.io"
          fi
          echo "ROBOTELIER_BASE_URL=$base_url" >> "$GITHUB_ENV"
      - name: Check Quartz source configuration
        run: npm run check --prefix site
      - name: Build the metadata-only wiki
        env:
          WIKI_PATH: ${{ github.workspace }}/data/wiki
        run: npm run build --prefix site
      - name: Reject symlinks and an empty Pages output
        run: |
          python3 -c 'from pathlib import Path; root=Path("site/public"); assert root.is_dir() and any(root.rglob("*.html")); assert not any(path.is_symlink() for path in root.rglob("*"))'
      - name: Upload the verified Pages artifact
        if: ${{ inputs.publish_pages || (github.event_name == 'workflow_run' && vars.ROBOTELIER_PAGES_ENABLED == 'true') }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/public
          retention-days: 1

  deploy:
    if: ${{ inputs.publish_pages || (github.event_name == 'workflow_run' && vars.ROBOTELIER_PAGES_ENABLED == 'true') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
