name: Daily robotics research

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the intended cycle without inference, network, commits, or delivery
        required: false
        default: true
        type: boolean
      operation_selector:
        description: Optional queued operation selector for operator diagnostics
        required: false
        default: ""
        type: string
      maximum_operations:
        description: Shared-cycle operation ceiling, never above 20
        required: false
        default: "20"
        type: string
      intended_slot:
        description: Europe/Rome local date; blank means the current local date
        required: false
        default: ""
        type: string
      resume_id:
        description: Existing run ID for exact-stage recovery
        required: false
        default: ""
        type: string
      publish_pages:
        description: Publish the committed wiki after a successful live run
        required: false
        default: true
        type: boolean
      send_telegram:
        description: Send the committed daily report summary after a successful live run
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: robotelier-write
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    container:
      image: nousresearch/hermes-agent@sha256:9c841866021c54c4596849f6135717e8a4d52ba510b7f52c50aef1de1a283973
      options: --user 0:0
    defaults:
      run:
        shell: bash
    env:
      OPENAI_HOME: /tmp/robotelier-openai-hermes
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the mounted checkout for Git writes
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install pinned project runner
        env:
          UV_TOOL_BIN_DIR: /tmp/robotelier-uv/bin
          UV_TOOL_DIR: /tmp/robotelier-uv/tools
        run: |
          uv tool install --no-cache uv==0.12.2
          [[ "$("$UV_TOOL_BIN_DIR/uv" --version)" == "uv 0.12.2"* ]]
          echo "$UV_TOOL_BIN_DIR" >> "$GITHUB_PATH"
      - name: Install locked application
        run: uv sync --locked --all-groups
      - name: Resolve and validate cycle identity
        id: cycle
        env:
          INPUT_DATE: ${{ inputs.intended_slot }}
          INPUT_MAX: ${{ inputs.maximum_operations || '20' }}
        run: |
          case "$INPUT_MAX" in ''|*[!0-9]*) exit 2;; esac
          test "$INPUT_MAX" -ge 1 -a "$INPUT_MAX" -le 20
          local_date="${INPUT_DATE:-$(TZ=Europe/Rome date +%F)}"
          date -d "$local_date" +%F >/dev/null
          run_id="research-${local_date}-${GITHUB_RUN_ID}"
          publish_pages="${{ inputs.publish_pages }}"
          send_telegram="${{ inputs.send_telegram }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            publish_pages="${{ vars.ROBOTELIER_PAGES_ENABLED }}"
            send_telegram="${{ vars.ROBOTELIER_SEND_TELEGRAM }}"
          fi
          echo "local_date=$local_date" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "publish_pages=$publish_pages" >> "$GITHUB_OUTPUT"
          echo "send_telegram=$send_telegram" >> "$GITHUB_OUTPUT"
      - name: Offline preflight and dry-run contract
        env:
          LOCAL_DATE: ${{ steps.cycle.outputs.local_date }}
          RUN_ID: ${{ steps.cycle.outputs.run_id }}
          INPUT_MAX: ${{ inputs.maximum_operations || '20' }}
          PUBLISH_PAGES: ${{ steps.cycle.outputs.publish_pages }}
          SEND_TELEGRAM: ${{ steps.cycle.outputs.send_telegram }}
        run: |
          uv run robotelier integrity check --strict
          if [ "${{ inputs.dry_run || github.event_name == 'workflow_dispatch' }}" = "true" ]; then
            channel_args=()
            if [ "$PUBLISH_PAGES" = "true" ]; then channel_args+=(--publish-pages); fi
            if [ "$SEND_TELEGRAM" = "true" ]; then channel_args+=(--send-telegram); fi
            uv run robotelier daily prepare --run-id "$RUN_ID" --intended-slot "$LOCAL_DATE" --trigger "${{ github.event_name }}" --dry-run --maximum-operations "$INPUT_MAX" "${channel_args[@]}"
          fi
      - name: Stop after dry run
        if: ${{ inputs.dry_run || (github.event_name == 'workflow_dispatch' && inputs.dry_run == null) }}
        run: echo "Dry run completed without durable state mutation."
      - name: Require explicit production activation
        if: ${{ !inputs.dry_run && github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: test "${{ vars.ROBOTELIER_PRODUCTION_ENABLED }}" = "true"
      - name: Configure isolated Hermes profile
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' }}
        run: |
          uv run robotelier agent configure --profile scout --hermes-home "$OPENAI_HOME" --replace-unmanaged
          chown --recursive hermes:hermes "$OPENAI_HOME"
          HERMES_HOME="$OPENAI_HOME" hermes skills opt-in --sync
      - name: Install checksum-verified age 1.3.1
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' }}
        run: |
          archive="$RUNNER_TEMP/age-v1.3.1-linux-amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz"
          echo "bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  $archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
          install -m 755 "$RUNNER_TEMP/age/age-keygen" /usr/local/bin/age-keygen
          test "$(age --version)" = "v1.3.1"
          test "$(age-keygen --version)" = "v1.3.1"
      - name: Restore capability-scoped OAuth envelopes
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          test -n "$OPENAI_OAUTH_SECRET"
          install -m 600 /dev/null /tmp/robotelier-age-identity
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > /tmp/robotelier-age-identity
          unset OPENAI_OAUTH_SECRET
          uv run robotelier credential restore --profile scout --hermes-home "$OPENAI_HOME" --identity-file /tmp/robotelier-age-identity
          chown hermes:hermes "$OPENAI_HOME/auth.json"
          test "$(stat -c %a "$OPENAI_HOME/auth.json")" = "600"
          rm -f /tmp/robotelier-age-identity
      - name: Run strictly sequential profiles
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' }}
        env:
          LOCAL_DATE: ${{ steps.cycle.outputs.local_date }}
          RUN_ID: ${{ steps.cycle.outputs.run_id }}
          INPUT_MAX: ${{ inputs.maximum_operations || '20' }}
          PUBLISH_PAGES: ${{ steps.cycle.outputs.publish_pages }}
          SEND_TELEGRAM: ${{ steps.cycle.outputs.send_telegram }}
        run: |
          channel_args=()
          if [ "$PUBLISH_PAGES" = "true" ]; then channel_args+=(--publish-pages); fi
          if [ "$SEND_TELEGRAM" = "true" ]; then channel_args+=(--send-telegram); fi
          uv run robotelier daily prepare --run-id "$RUN_ID" --intended-slot "$LOCAL_DATE" --trigger "${{ github.event_name }}" --maximum-operations "$INPUT_MAX" "${channel_args[@]}"
          uv run robotelier agent preflight --profile scout --hermes-home "$OPENAI_HOME" --live
          uv run robotelier agent run --profile scout --hermes-home "$OPENAI_HOME" --run-id "$RUN_ID" --cycle-id "$LOCAL_DATE" --maximum-operations "$INPUT_MAX"
          uv run robotelier agent configure --profile x --hermes-home "$OPENAI_HOME"
          chown --recursive hermes:hermes "$OPENAI_HOME"
          HERMES_HOME="$OPENAI_HOME" hermes skills opt-in --sync
          uv run robotelier agent preflight --profile x --hermes-home "$OPENAI_HOME" --live
          uv run robotelier agent run --profile x --hermes-home "$OPENAI_HOME" --run-id "$RUN_ID" --cycle-id "$LOCAL_DATE" --maximum-operations "$INPUT_MAX"
          uv run robotelier agent configure --profile editorial --hermes-home "$OPENAI_HOME"
          chown --recursive hermes:hermes "$OPENAI_HOME"
          HERMES_HOME="$OPENAI_HOME" hermes skills opt-in --sync
          uv run robotelier agent preflight --profile editorial --hermes-home "$OPENAI_HOME" --live
          uv run robotelier agent run --profile editorial --hermes-home "$OPENAI_HOME" --run-id "$RUN_ID" --cycle-id "$LOCAL_DATE" --maximum-operations "$INPUT_MAX"
          uv run robotelier daily finalize --run-id "$RUN_ID"
          uv run robotelier integrity check --strict
      - name: Persist verified OAuth refresh state as ciphertext
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' && always() }}
        env:
          OPENAI_OAUTH_SECRET: ${{ secrets.OPENAI_OAUTH_SECRET }}
        run: |
          test -n "$OPENAI_OAUTH_SECRET"
          install -m 600 /dev/null /tmp/robotelier-age-identity
          printf '%s\n' "$OPENAI_OAUTH_SECRET" > /tmp/robotelier-age-identity
          unset OPENAI_OAUTH_SECRET
          if test -f "$OPENAI_HOME/auth.json"; then
            uv run robotelier credential seal --profile editorial --hermes-home "$OPENAI_HOME" --identity-file /tmp/robotelier-age-identity
          fi
          rm -f /tmp/robotelier-age-identity
      - name: Remove plaintext OAuth from temporary homes
        if: ${{ always() }}
        run: rm -f "$OPENAI_HOME/auth.json" /tmp/robotelier-age-identity
      - name: Commit validated public state
        id: research_commit
        if: ${{ !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' && always() }}
        run: |
          test -z "$(git status --porcelain | awk '$2 !~ /^data\// && $2 != ".robotelier/credentials/oauth-auth.json.age" {print}')"
          git add --all -- data .robotelier/credentials/oauth-auth.json.age
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name robotelier-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "research: record daily robotics cycle"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          uv run robotelier integrity check --strict
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git config --local credential.helper '!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$ROBOTELIER_GIT_TOKEN"; fi; }; f'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          ROBOTELIER_GIT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Prepare committed daily report summary intent
        id: summary_intent
        if: ${{ success() && !inputs.dry_run && vars.ROBOTELIER_PRODUCTION_ENABLED == 'true' && steps.cycle.outputs.send_telegram == 'true' }}
        env:
          LOCAL_DATE: ${{ steps.cycle.outputs.local_date }}
          DELIVERY_RUN_ID: ${{ steps.cycle.outputs.run_id }}
          SOURCE_COMMIT: ${{ steps.research_commit.outputs.source_commit }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          report_slug="daily-report_${LOCAL_DATE//-/}"
          report_url="https://${owner}.github.io/${repository_name}/daily-reports/${report_slug}"
          uv run robotelier report prepare-summary --local-date "$LOCAL_DATE" --source-commit "$SOURCE_COMMIT" --report-url "$report_url" --delivery-run-id "$DELIVERY_RUN_ID"
          uv run robotelier integrity check --strict
      - name: Commit daily report summary intent
        if: ${{ success() && steps.summary_intent.outcome == 'success' }}
        env:
          ROBOTELIER_GIT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/published/daily-reports
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "delivery: record daily report summary intent"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          uv run robotelier integrity check --strict
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git config --local credential.helper '!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$ROBOTELIER_GIT_TOKEN"; fi; }; f'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Deliver committed daily report summary
        id: summary_delivery
        if: ${{ success() && steps.summary_intent.outcome == 'success' }}
        env:
          LOCAL_DATE: ${{ steps.cycle.outputs.local_date }}
          DELIVERY_RUN_ID: ${{ steps.cycle.outputs.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          uv run robotelier report deliver-summary --local-date "$LOCAL_DATE" --delivery-run-id "$DELIVERY_RUN_ID"
      - name: Commit daily report delivery receipt
        if: ${{ always() && steps.summary_delivery.outcome != 'skipped' }}
        env:
          ROBOTELIER_GIT_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/published/daily-reports
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "delivery: record daily report summary result"
          git fetch --no-tags origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          uv run robotelier integrity check --strict
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git config --local credential.helper '!f() { if test "$1" = get; then echo username=x-access-token; echo "password=$ROBOTELIER_GIT_TOKEN"; fi; }; f'
          git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Require acknowledged daily report delivery
        if: ${{ always() && steps.summary_intent.outcome == 'success' }}
        env:
          LOCAL_DATE: ${{ steps.cycle.outputs.local_date }}
        run: uv run robotelier report verify-summary --local-date "$LOCAL_DATE"
