[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "robotelier"
version = "0.1.0"
description = "Git-native, provenance-first autonomous robotics research and podcast system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Robotelier contributors" }]
dependencies = [
  "edge-tts==7.2.8",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.scripts]
robotelier = "robotelier.cli:main"

[dependency-groups]
dev = [
  "hypothesis==6.161.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robotelier"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires explicitly configured external services",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]
